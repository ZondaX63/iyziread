[package]
name = "iyzi-reader"
version = "1.0.0"
description = "Iyzi Reader - offline speed reader"
edition = "2021"

[lib]
name = "iyzi_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
