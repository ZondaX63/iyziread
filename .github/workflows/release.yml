name: Release

# Push a tag like v1.0.0 (or run manually) to build Windows .exe/.msi, Linux and Android .apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install
      - name: Build web app (static)
        run: bun run build && node scripts/prepare-tauri.mjs
        env: { TAURI: "1" }
      - name: Icons
        run: bun run tauri icon src-tauri/app-icon.png
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          releaseName: "Iyzi Reader ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          releaseBody: "Windows (.exe/.msi), macOS (.dmg), Linux (.AppImage/.deb) ve Android (.apk) indirmeleri aşağıda."
          releaseDraft: false
          prerelease: false

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Setup Android NDK (preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.12077973"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: bun install
      - name: Build web app (static)
        run: bun run build && node scripts/prepare-tauri.mjs
        env: { TAURI: "1" }
      - name: Build APK
        run: |
          bun run tauri icon src-tauri/app-icon.png
          bun run tauri android init --ci
          bun run tauri android build --apk --debug
          mkdir -p out
          find src-tauri/gen/android -name "*.apk" -exec cp {} out/IyziReader-android.apk \;
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          files: out/IyziReader-android.apk
