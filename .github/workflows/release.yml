name: Release

# Push a tag like v1.0.0 (or run manually) to build Windows .exe/.msi, Linux and Android .apk
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install
      - name: Build web app (static)
        run: bun run build && node scripts/prepare-tauri.mjs
        env: { TAURI: "1" }
      - name: Icons
        run: bun run tauri icon src-tauri/app-icon.png
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          releaseName: "Iyzi Reader ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}"
          releaseBody: "Windows (.exe/.msi), macOS (.dmg), Linux (.AppImage/.deb) ve Android (.apk) indirmeleri aşağıda."
          releaseDraft: false
          prerelease: false

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Setup Android NDK (preinstalled SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.0.12077973"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: bun install
      - name: Build web app (static)
        run: bun run build && node scripts/prepare-tauri.mjs
        env: { TAURI: "1" }
      - name: Build APK (release, per-ABI)
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
          CARGO_PROFILE_RELEASE_LTO: "true"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "s"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: |
          bun run tauri android init --ci
          bun run tauri icon src-tauri/app-icon.png
          RES=src-tauri/gen/android/app/src/main/res
          cp -r src-tauri/icons/android/. "$RES/"
          bun run tauri android build --apk --split-per-abi --target aarch64 --target armv7
      - name: Sign APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          keytool -genkeypair -v -keystore ks.jks -alias iyzi -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass iyzireader -keypass iyzireader -dname "CN=Iyzi Reader"
          mkdir -p out
          for f in $(find src-tauri/gen/android -name "*-release-unsigned.apk"); do
            case "$f" in
              *arm64*) name=IyziReader-android-arm64.apk ;;
              *arm*) name=IyziReader-android-armv7.apk ;;
              *) continue ;;
            esac
            "$BT/zipalign" -f 4 "$f" "out/aligned.apk"
            "$BT/apksigner" sign --ks ks.jks --ks-pass pass:iyzireader --key-pass pass:iyzireader \
              --out "out/$name" out/aligned.apk
            rm out/aligned.apk
          done
          ls -lh out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          files: out/*.apk
